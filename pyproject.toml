[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "genome-nutrition-predictor"
version = "0.1.0"
description = "Rule-based bacterial nutrition requirement and substrate preference predictor"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "typer>=0.12",
  "pandas>=2.0",
  "pyyaml>=6.0",
  "biopython>=1.83",
]

[project.scripts]
genome_nutrition_predictor = "genome_nutrition_predictor.cli:app"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
